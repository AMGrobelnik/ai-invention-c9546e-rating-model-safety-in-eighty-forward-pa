[project]
name = "alpha50-price-of-refusal"
version = "2.0.0"
description = "alpha_50: the steering price of refusal, powered and de-confounded (iteration 2)"
requires-python = ">=3.12"

# Every dependency is pinned to the EXACT version resolved in this run's .venv
# (`uv pip freeze`), including transitive packages, so the environment is
# reproducible byte-for-byte rather than merely compatible.
#
# torch carries its CUDA local version (2.6.0+cu124) because that is what was
# actually installed and used on the RTX 4000 Ada. It resolves only from the
# PyTorch CUDA 12.4 index, declared under [[tool.uv.index]] below; the pip
# equivalent is:
#   uv pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cu124
dependencies = [
    "accelerate==1.14.0",
    "annotated-doc==0.0.5",
    "anyio==4.14.2",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.0",
    "click==8.4.2",
    "filelock==3.29.0",
    "fsspec==2026.4.0",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.27.0",
    "idna==3.18",
    "jinja2==3.1.6",
    "loguru==0.7.3",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numpy==2.5.2",
    "nvidia-cublas-cu12==12.4.5.8",
    "nvidia-cuda-cupti-cu12==12.4.127",
    "nvidia-cuda-nvrtc-cu12==12.4.127",
    "nvidia-cuda-runtime-cu12==12.4.127",
    "nvidia-cudnn-cu12==9.1.0.70",
    "nvidia-cufft-cu12==11.2.1.3",
    "nvidia-curand-cu12==10.3.5.147",
    "nvidia-cusolver-cu12==11.6.1.9",
    "nvidia-cusparse-cu12==12.3.1.170",
    "nvidia-cusparselt-cu12==0.6.2",
    "nvidia-nccl-cu12==2.21.5",
    "nvidia-nvjitlink-cu12==12.4.127",
    "nvidia-nvtx-cu12==12.4.127",
    "packaging==26.3",
    "pandas==3.0.5",
    "patsy==1.0.2",
    "psutil==7.2.2",
    "pygments==2.20.0",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "requests==2.34.2",
    "rich==15.0.0",
    "safetensors==0.8.0",
    "scipy==1.18.0",
    "setuptools==78.1.0",
    "shellingham==1.5.4",
    "six==1.17.0",
    "statsmodels==0.14.6",
    "sympy==1.13.1",
    "tokenizers==0.22.2",
    "torch==2.6.0+cu124",
    "tqdm==4.70.0",
    "transformers==5.15.0",
    "triton==3.2.0",
    "typer==0.27.1",
    "typing-extensions==4.15.0",
    "urllib3==2.7.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.aii]
# Recorded for provenance: the hardware this pin set was resolved and run on.
gpu = "NVIDIA RTX 4000 Ada Generation (20 GB)"
cuda = "12.4"
python = "3.12"
entrypoint = "method.py"
tiers = "0 = gates + estimator certification; 1/2 = sweeps; 3 = judge; 4 = assembly; 9 = 1->2->3->4 in one process"
