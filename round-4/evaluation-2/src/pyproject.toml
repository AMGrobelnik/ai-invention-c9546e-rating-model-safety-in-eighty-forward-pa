  "requests==2.34.2",
  "transformers==5.15.0",
  "tokenizers==0.22.2",
  # transitive, pinned so the re-tokenised screen reproduces byte-for-byte
  "huggingface-hub==1.27.0",
  "safetensors==0.8.0",
  "regex==2026.7.19",
  "pyyaml==6.0.3",
  "filelock==3.32.2",
  "packaging==26.3",
  "tqdm==4.70.0",
  "certifi==2026.7.22",
  "charset-normalizer==3.5.0",
  "idna==3.18",
  "urllib3==2.7.0",
  "typing-extensions==4.16.0",
  "contourpy==1.3.3",
  "cycler==0.12.1",
  "fonttools==4.63.0",
  "kiwisolver==1.5.0",
  "pillow==12.3.0",
  "pyparsing==3.3.2",
  "python-dateutil==2.9.0.post0",
  "six==1.17.0",
