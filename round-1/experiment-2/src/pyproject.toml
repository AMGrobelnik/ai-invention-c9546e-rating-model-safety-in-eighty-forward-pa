[project]
name = "steering-hysteresis-qwen3"
version = "1.0.0"
description = "Does refusal stick? A pre-registered steering-hysteresis test on the Qwen3-0.6B lineage."
requires-python = "==3.12.13"
dependencies = [
    "accelerate==1.14.0",
    "datasets==5.0.1",
    "huggingface-hub==1.27.0",
    "loguru==0.7.3",
    "numpy==2.5.2",
    "psutil==7.2.2",
    "safetensors==0.8.0",
    "scipy==1.18.0",
    "tokenizers==0.22.2",
    "torch==2.6.0+cu124",
    "transformers==5.15.0",
]

# torch 2.6.0+cu124 is not on PyPI proper; install it from the PyTorch CUDA 12.4
# index first, then the rest:
#   uv pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cu124
#   uv pip install -r pyproject.toml
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
